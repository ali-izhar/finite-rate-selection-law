name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m src
      - run: python -m pytest -q src/simple/tests   # the GPU test is skipped: torch is not installed
      - run: python -m checks.claims
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node visual/lib/sim.test.mjs
