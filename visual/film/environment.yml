# The narrated film: manim scenes, captions, assembly.
#   micromamba create -f visual/film/environment.yml    (or: conda env create -f ...)
#   MANIM_ENV=<env prefix> visual/film/build.sh render
# Also needs TeX Live with latex and dvisvgm on PATH (tested with TeX Live 2025;
# set TEXLIVE_BIN to its bin folder). Narration (tts.py) calls the ElevenLabs API
# and reads ELEVEN_LABS_API_KEY from an untracked .env; the committed media do not need it.
name: film
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - manim=0.20.1
  - manimpango=0.6.1
  - numpy=2.5.3
  - scipy=1.18.1
  - pillow=12.3.0
  - ffmpeg=9.0.2
  - cairo=1.18.6
  - pango=1.58.2
  - pip
